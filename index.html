<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13213c">
  <title>LogiParcours — Logistique & Transport</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <style>:root{
  --navy:#13213c; --navy-2:#1f3460; --orange:#f28c28; --orange-2:#ffb35c; --bg:#f3f5f9; --card:#fff;
  --ink:#1b2333; --muted:#6b7487; --line:#e2e6ee; --ok:#1f9d74; --ok-bg:#e3f6ef; --ko:#d64545; --ko-bg:#fdeaea;
  --mid:#d89a14; --mid-bg:#fff4dc; --blue:#2f6fd6; --blue-bg:#e8f0fd; --radius:14px; --shadow:0 2px 10px rgba(19,33,60,.07);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue)}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
.muted{color:var(--muted)} small{font-size:.82em}
.mono{font-family:ui-monospace,Consolas,monospace;letter-spacing:.08em}
.hidden{display:none}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.65em 1.1em;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s;min-height:44px}
.btn:hover{border-color:var(--navy-2)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1b1206}
.btn.primary:hover{background:#e37b12}
.btn.ghost{background:transparent}
.btn.sm{padding:.35em .7em;min-height:34px;font-size:.88rem}
.btn.big{font-size:1.1rem;padding:.8em 1.4em;width:100%}
.btn.danger{color:var(--ko)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 16px;background:var(--navy);color:#fff}
.topbar .btn{color:#fff;border-color:rgba(255,255,255,.25)}
.topbar .btn.ghost:hover{border-color:#fff}
.brand{font-weight:800;letter-spacing:.02em}
.who{font-weight:600;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:.1em .55em;border-radius:999px;background:var(--orange);color:#1b1206;font-size:.78rem;font-weight:700}
.badge.warn{background:#ffd166}.badge.soft{background:var(--line);color:var(--muted);font-weight:600}
.page{max-width:920px;margin:0 auto;padding:18px 14px 60px}
.page.wide{max-width:1240px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin:14px 0}

/* Login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy-2) 60%,#2b4a85 100%)}
.login-card{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}
.logo{font-size:2.4rem}.logo span{display:block;font-size:1.5rem;font-weight:800;color:var(--navy)}
.login-form{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:14px}
.login-form label{font-weight:600;font-size:.92rem}
.login-form input:not([type=checkbox]){font:inherit;padding:.75em;border:1.5px solid var(--line);border-radius:10px}
.code-input{font-size:1.6rem!important;text-align:center;letter-spacing:.25em;text-transform:uppercase;font-family:ui-monospace,Consolas,monospace!important}
.check{display:flex;gap:8px;align-items:center;font-weight:400!important}
.err{color:var(--ko);min-height:1.2em;font-size:.92rem}
.prof-link{display:inline-block;margin-top:14px;font-size:.92rem}
.demo-note{margin-top:16px;padding:10px;border-radius:10px;background:#fff7e6;font-size:.85rem;text-align:left}
code{background:#eef1f6;padding:.05em .35em;border-radius:5px}

/* Accueil élève */
.hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.hero .muted{color:#c5cee0}
.hero-stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 14px;min-width:120px}
.stat b{display:block;font-size:1.5rem}.stat span{font-size:.82rem;color:#d7deeb}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.hero .bar{background:rgba(255,255,255,.18)}
.bar.big{height:10px}
.bar-fill{height:100%;background:var(--orange);border-radius:99px;transition:width .4s}
.games-tile{display:flex;align-items:center;gap:10px;margin:14px 0;padding:14px 18px;border-radius:14px;background:linear-gradient(90deg,#6b3fd6,#9d5cf0);color:#fff;text-decoration:none;font-size:1.05rem}
.games-tile span{margin-left:auto;font-size:.9rem}
.games-tile.locked{opacity:.6}
.bloc{margin-top:26px}
.bloc-head p{margin:.2em 0 .6em}
.bloc-code{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);background:#fff1e0;padding:.15em .6em;border-radius:6px}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod-card{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;border:2px solid transparent;transition:.15s}
a.mod-card:hover{border-color:var(--orange);transform:translateY(-2px)}
.mod-card.st-available,.mod-card.st-inprogress{border-color:var(--orange)}
.mod-card.st-done{border-color:#bfe8d8}
.mod-card.st-locked,.mod-card.st-soon{opacity:.6;background:#f8f9fb}
.mod-num{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mod-title{font-weight:700;font-size:1.02rem}
.mod-comp{display:flex;flex-wrap:wrap;gap:4px}
.mod-comp span{font-size:.72rem;background:var(--blue-bg);color:var(--blue);padding:.1em .45em;border-radius:5px;font-weight:600}
.mod-comp .dur{background:#eef1f6;color:var(--muted)}
.mod-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:.9rem}
.grade{font-weight:800;color:var(--navy)}
.lock-txt{font-size:.82rem;color:var(--muted)}

/* Page module */
.mod-head{padding:6px 2px}
.objectifs ul{margin:.3em 0 0;padding-left:1.2em}
.steps{list-style:none;padding:0;margin:0}
.step{display:flex;gap:14px;background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:var(--shadow);border-left:5px solid var(--line)}
.step.current{border-left-color:var(--orange)}
.step.done{border-left-color:var(--ok)}
.step-ico{flex:0 0 38px;height:38px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-weight:800}
.step.current .step-ico{background:var(--orange);color:#fff}
.step.done .step-ico{background:var(--ok);color:#fff}
.step-body{flex:1;min-width:0}
.step-body p{margin:.2em 0 .7em}
.acts{display:grid;gap:8px}
.act{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;background:#fff}
.act:hover{border-color:var(--orange)}
.act.done{background:#fbfdfc}
.act.disabled{opacity:.5;pointer-events:none}
.act-emoji{font-size:1.6rem}.act-emoji.big{font-size:3rem}
.act-txt{flex:1;font-weight:600}.act-txt small{display:block;color:var(--muted);font-weight:500}
.act-score{text-align:right}.act-score small{display:block;color:var(--muted)}
.stars{color:var(--orange);letter-spacing:2px;font-size:1.05rem}.stars .off{color:#d8dce4}
.result-line{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline}
.big-grade{font-size:2.6rem;font-weight:900;color:var(--navy)}
.big-grade small{font-size:1rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--blue);margin:.6em 0}

/* Cours */
.cours .bar{margin:6px 0 4px}
.slide h2{margin-top:.3em}
.cours-body{font-size:1.03rem}
.qnum{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.keybox{background:#fff4e5;border-left:4px solid var(--orange);padding:10px 14px;border-radius:8px;margin:12px 0}
.keybox.warn{background:var(--ko-bg);border-color:var(--ko)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0}
.flow .node{background:var(--navy);color:#fff;padding:8px 12px;border-radius:10px;font-weight:700;font-size:.92rem}
.flow .node small{display:block;font-weight:400;color:#cfd7e6;font-size:.78rem;max-width:200px}
.flow .node.end{background:var(--orange);color:#1b1206}
.flow .arrow{color:var(--orange);font-weight:900}
.cards4{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cards4 li{background:#f6f8fc;border-radius:12px;padding:12px;border-top:4px solid var(--orange)}
.cards4 li>b:first-child{display:block;margin-bottom:4px}
.two,.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:10px 0}
.pill-box{border-radius:12px;padding:12px}.pill-box>b:first-child{display:block;margin-bottom:4px}
.pill-box.phys{background:#fff1e0}.pill-box.info{background:var(--blue-bg)}.pill-box.fin{background:var(--ok-bg)}
.jobs{list-style:none;padding:0}.jobs li{padding:8px 0;border-bottom:1px solid var(--line)}.jobs span{font-size:1.3rem;margin-right:8px}
.verif{margin-top:16px;padding:14px;border-radius:12px;background:#f7f9fc;border:1.5px dashed #c9d2e2}
.verif:empty{display:none}
.verif h4{margin:0 0 6px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}

/* Tables */
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:#f6f8fc;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.cours-body .tbl{background:#fff;border-radius:10px;overflow:hidden}
.tbl.hover tr.clickable{cursor:pointer}.tbl.hover tr.clickable:hover td{background:#fbf6ef}
.tbl.grid td{text-align:center}.tbl.grid td:first-child{text-align:left}
td.good{color:var(--ok);font-weight:700}td.bad,.bad{color:var(--ko);font-weight:700}
tr.inactive td{opacity:.5}

/* Activités */
.runner-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.runner-title{flex:1;font-weight:800;text-align:center}
.runner-meta{display:flex;gap:10px;font-weight:700;min-width:70px;justify-content:flex-end}
.chrono.hot{color:var(--ko);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.is-test .bar-fill{background:var(--navy-2)}
.context{background:#fffdf7;border:1.5px solid #f3e1c0;border-radius:12px;padding:6px 14px;margin:10px 0}
.context-body{font-size:.95rem;max-height:45vh;overflow:auto}
.item-type{display:inline-block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);margin:8px 0 2px}
.item-q{font-size:1.12rem;font-weight:700;margin-bottom:12px}
.opts{display:grid;gap:8px}
.opts.vf{grid-template-columns:1fr 1fr}
.opt{text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;cursor:pointer;min-height:50px}
.opts.vf .opt{text-align:center;font-weight:700;font-size:1.1rem}
.opt:hover{border-color:var(--navy-2)}
.opt.sel{border-color:var(--navy);background:#eef2fa}
.opt.ok,.seg button.ok,.chip.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important}
.opt.ko,.seg button.ko,.chip.ko{border-color:var(--ko)!important;background:var(--ko-bg)!important}
.match{display:grid;gap:8px}
.match-row{display:grid;grid-template-columns:minmax(110px,35%) 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:10px;background:#f7f9fc}
.match-row.ok{background:var(--ok-bg)}.match-row.ko{background:var(--ko-bg)}
.match-l{font-weight:700}
select,input[type=number],input.pseudo,textarea{font:inherit;padding:.55em .6em;border:1.5px solid var(--line);border-radius:9px;background:#fff;max-width:100%}
textarea{width:100%}
.match select{width:100%}
.mark{font-weight:800}.mark small{display:block;font-weight:500;color:var(--ko)}
.order-ans{min-height:56px;display:flex;flex-direction:column;gap:6px;padding:10px;border:2px dashed #c9d2e2;border-radius:12px;margin-bottom:8px}
.order-ans .empty{color:var(--muted);text-align:center;padding:6px}
.order-pool{display:flex;flex-wrap:wrap;gap:8px}
.order-hint{font-size:.85rem;color:var(--muted);margin:4px 0 8px}
.chip{padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;font:inherit;cursor:pointer;text-align:left}
.chip.placed{border-color:var(--navy-2);background:#eef2fa}
.chip b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8rem;margin-right:6px}
.sort{display:grid;gap:8px}
.sort-row{padding:10px;border-radius:12px;background:#f7f9fc}
.sort-t{font-weight:600;margin-bottom:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;padding:8px 10px;border:2px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-size:.9rem;cursor:pointer;min-height:40px}
.seg button.sel{border-color:var(--navy);background:var(--navy);color:#fff}
.fill{line-height:2.4;font-size:1.05rem}
.fill select{margin:0 3px}
select.ok,input.ok{border-color:var(--ok);background:var(--ok-bg)}select.ko,input.ko{border-color:var(--ko);background:var(--ko-bg)}
.corr{color:var(--ok);font-weight:700}
.num input{font-size:1.3rem;padding:.5em;width:180px;border:2px solid var(--line);border-radius:10px}
.actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.actions .btn{align-self:flex-end;min-width:180px}
.fb{font-weight:800;padding:10px 12px;border-radius:10px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.ko{background:var(--ko-bg);color:var(--ko)}.fb.mid{background:var(--mid-bg);color:#9a6b00}
.combo{margin-left:8px;font-size:.9em}
.explain{background:#f6f8fc;padding:10px 12px;border-radius:10px;margin-top:6px}
.intro{text-align:center}.intro .btn.big{max-width:340px;margin-top:10px}
.intro ul{text-align:left;display:inline-block}
.result{text-align:center}
.result details{text-align:left}
.result-stars .stars{font-size:2.4rem}
.recap{padding-left:1.2em}.recap li{margin:8px 0;padding:8px 10px;border-radius:10px;background:#f7f9fc}
.recap li.ok{background:var(--ok-bg)}.recap li.ko{background:var(--ko-bg)}.recap li.mid{background:var(--mid-bg)}
.recap .rq{font-weight:600}.recap .rs{font-size:.9rem}
.memory{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.mcard{position:relative;min-height:96px;border:none;border-radius:12px;cursor:pointer;font:inherit;font-size:.85rem;padding:8px;background:var(--navy);color:#fff;transition:.25s}
.mcard .front{display:none}.mcard .back{font-size:2rem;font-weight:900;color:var(--orange-2)}
.mcard.flip .front{display:block}.mcard.flip .back{display:none}
.mcard.flip.side0{background:#fff1e0;color:var(--ink);font-weight:800}.mcard.flip.side1{background:var(--blue-bg);color:var(--ink)}
.mcard.found{outline:3px solid var(--ok);opacity:.75;cursor:default}
.hint{color:var(--muted)}
.empty-state{text-align:center;padding:30px}

/* Prof */
.topbar.prof{flex-wrap:wrap}
.class-switch{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px}
.class-switch a{color:#fff;text-decoration:none;padding:6px 14px;border-radius:8px;font-weight:700}
.class-switch a.on{background:var(--orange);color:#1b1206}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:56px;z-index:10}
.tabs a{padding:12px 14px;text-decoration:none;color:var(--muted);font-weight:600;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a.on{color:var(--navy);border-color:var(--orange)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:14px 0}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.8rem;color:var(--navy)}.kpi span{color:var(--muted);font-size:.88rem}
.live{font-size:.85rem}.live::first-letter{color:var(--ok)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c4cad6;vertical-align:middle}
.dot.on{background:#22c55e;box-shadow:0 0 0 3px #dcfce7}
.mini-bar{display:inline-block;width:80px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;vertical-align:middle}
.mini-bar div{height:100%;background:var(--orange)}
.alert{display:inline-block;background:var(--ko-bg);color:var(--ko);font-size:.75rem;font-weight:700;padding:.15em .5em;border-radius:6px;margin:1px}
.chip-s{display:inline-block;min-width:30px;text-align:center;padding:2px 4px;margin:1px;border-radius:6px;font-size:.8rem;font-weight:700}
.chip-s.ok{background:var(--ok-bg);color:var(--ok)}.chip-s.ko{background:var(--ko-bg);color:var(--ko)}.chip-s.off{background:#eef1f6;color:#a1a8b6}
.acts-cell{white-space:nowrap}
.student-head .row-info{display:flex;flex-wrap:wrap;gap:16px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.big-code{font-size:1.1rem;font-weight:800}
.switch{position:relative;display:inline-block;width:44px;height:24px}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#c4cad6;border-radius:99px;transition:.2s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}.switch input:checked+span::before{transform:translateX(20px)}
.bloc-set-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.seg.vis{flex-wrap:nowrap}.seg.vis button{flex:0 0 auto;font-size:.82rem;padding:6px 9px}
.seg.vis button.v-hidden{background:#6b7487;border-color:#6b7487}.seg.vis button.v-locked{background:var(--mid);border-color:var(--mid)}.seg.vis button.v-open{background:var(--ok);border-color:var(--ok)}
.legend ul{margin:.4em 0}
.pw{width:80px}

/* Impression des codes */
.print-bar{display:flex;gap:10px;justify-content:space-between;padding:14px}
.print-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:10px}
.print-card{border:1px dashed #999;padding:14px;text-align:center;page-break-inside:avoid;background:#fff}
.pc-app{font-size:.75rem;color:#555}.pc-name{font-weight:800;font-size:1.1rem;margin:4px 0}
.pc-code{font-family:ui-monospace,Consolas,monospace;font-size:1.7rem;font-weight:900;letter-spacing:.15em}
.pc-url{font-size:.7rem;color:#333;word-break:break-all}.pc-note{font-size:.65rem;color:#777;margin-top:4px}
@media print{.no-print{display:none}body{background:#fff}.print-grid{padding:0}}

/* Toast */
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.3s;z-index:100;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.ok{background:var(--ok)}.toast.err{background:var(--ko)}

@media (max-width:600px){
  h1{font-size:1.35rem}
  .page{padding:12px 10px 50px}
  .card{padding:14px}
  .match-row{grid-template-columns:1fr auto}.match-row select{grid-column:1/-1;grid-row:2}
  .who .badge{display:none}
  .tabs{top:auto;position:static}
  .print-grid{grid-template-columns:repeat(2,1fr)}
  .step{padding:12px;gap:10px}
}
.modal-bg{position:fixed;inset:0;background:rgba(19,33,60,.55);display:grid;place-items:center;z-index:200;padding:16px}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal p{font-size:1.05rem;margin:0 0 6px}
.btn.danger-fill{background:var(--ko);border-color:var(--ko);color:#fff}

/* Référentiel */
.crumbs{font-size:.9rem;margin:4px 0 10px;color:var(--muted)}
.crumbs a{text-decoration:none}
.ref-hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-radius:18px;padding:20px;margin-bottom:14px}
.ref-hero p{color:#d7deeb}.ref-hero .muted{color:#c5cee0}
.ref-hero .ref-mods>span:first-child{color:#c5cee0}
.ref-icon{font-size:2rem}
.ref-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:10px}
.ref-facts div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px}
.ref-facts small{display:block;color:#c5cee0}
.ref-code{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-weight:800;background:var(--orange);color:#1b1206;border-radius:7px;padding:.1em .5em;font-size:.95rem}
.ref-code.sm{font-size:.78rem;background:#fff1e0;color:#b45f06;white-space:nowrap}
.ref-search{width:100%;font:inherit;padding:.8em 1em;border:1.5px solid var(--line);border-radius:12px;margin:4px 0 10px}
.ref-results{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:6px;margin-bottom:12px}
.ref-results a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}
.ref-results a:hover{background:#fbf6ef}
.ref-poles{display:grid;gap:10px}
.ref-pole{display:flex;align-items:center;gap:14px;background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow);text-decoration:none;color:inherit;border:2px solid transparent}
.ref-pole:hover,.ref-card:hover{border-color:var(--orange)}
.ref-pole-txt{flex:1;display:flex;flex-direction:column;gap:2px}
.ref-pole-txt b{font-size:1.08rem}
.chev{margin-left:auto;font-size:1.4rem;color:var(--orange);font-weight:800;transition:.2s}
details[open]>summary .chev{transform:rotate(90deg)}
.ref-tabs{margin-bottom:12px}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ref-card{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;border:2px solid transparent}
.ref-card .ref-code{align-self:flex-start}
.ref-list{display:grid;gap:8px}
.ref-item{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:0 14px}
.ref-item summary{display:flex;align-items:center;gap:10px;padding:12px 0;list-style:none;color:var(--ink);font-weight:600;margin:0}
.ref-item summary::-webkit-details-marker{display:none}
.ref-item[data-leaf] summary{cursor:default}
.ref-ind{background:#f7f9fc;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.ref-ind ul,.ref-savoirs{margin:.3em 0;padding-left:1.2em}
.ref-savoirs li{margin:3px 0}
.ref-taches{margin:0 0 12px;padding-left:1.2em}.ref-taches li{margin:4px 0;list-style:none}
.ref-taches b{color:var(--orange);margin-right:6px}
.ref-mods{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 10px;font-size:.85rem}
.ref-mods span:first-child{color:var(--muted)}
.ref-mod{background:var(--blue-bg);color:var(--blue);padding:.2em .6em;border-radius:7px;text-decoration:none;font-weight:600}
.ref-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ref-cols .card{margin:0}
.ref-general summary{margin:0}
.small-note{font-size:.82rem;margin-top:16px}
.mod-comp a{font-size:.72rem;background:var(--blue-bg);color:var(--blue);padding:.1em .45em;border-radius:5px;font-weight:600;text-decoration:none}
@media (max-width:600px){.hide-sm{display:none}}

/* Illustrations */
.illus{margin:14px 0;background:#fafbfd;border:1px solid var(--line);border-radius:12px;padding:10px}
.illus svg{width:100%;height:auto;display:block;max-height:340px}
.illus figcaption{font-size:.86rem;color:var(--muted);text-align:center;margin-top:6px}
.ref-refs{font-size:.85rem;color:#ffd9b0!important}
.ref-epreuve h4{margin:.8em 0 .2em}.ref-epreuve summary{margin:0}
</style>

  <text x="280" y="205" text-anchor="middle" font-size="12" fill="${f}">Lien de subordination : le salari\xE9 travaille sous l\u2019autorit\xE9 de l\u2019employeur.</text>`,"Contrat de travail"),"Trois \xE9l\xE9ments : une prestation de travail, une r\xE9mun\xE9ration, un lien de subordination.");var ts=`<p><b>LogiPlus</b> g\xE8re un entrep\xF4t pr\xE8s de Lyon.</p>
<p><b>Lundi 7 septembre</b> \u2014 Le fournisseur <b>TextilPro</b> livre <b>150 cartons</b> de t-shirts (r\xE9f\xE9rence <b>A123</b>) au quai n\xB03, avec un <b>bon de livraison</b>. Karim, agent de r\xE9ception, compte les cartons, v\xE9rifie la r\xE9f\xE9rence et la quantit\xE9, puis signe le bon de livraison. Les cartons sont rang\xE9s en <b>zone B</b> (all\xE9e B, niveau 2). Karim note l\u2019emplacement sur la <b>fiche de stock</b>.</p>
<p><b>Mercredi 9 septembre</b> \u2014 Le client <b>Mode Express</b> envoie un <b>bon de commande</b> : 40 unit\xE9s de A123, \xE0 livrer avant le vendredi 11. L\xE9a, pr\xE9paratrice, fait le <b>picking</b> en zone B et \xE9dite un <b>bordereau de pr\xE9paration</b>.</p>
<p>Sami, agent d\u2019exp\xE9dition, contr\xF4le, emballe, imprime l\u2019<b>\xE9tiquette de transport</b> et d\xE9pose le colis au quai n\xB01. Le transporteur <b>RapidFret</b> le r\xE9cup\xE8re le jeudi 10.</p>
<p><b>Vendredi 11 septembre</b> \u2014 Mode Express signale qu\u2019il ne re\xE7oit que <b>35 unit\xE9s</b> au lieu de 40 : 5 unit\xE9s ont \xE9t\xE9 oubli\xE9es sur le chariot. LogiPlus envoie aussit\xF4t les 5 unit\xE9s manquantes avec le transporteur <b>ExpressColis</b>, le jour m\xEAme.</p>`,ss=`<p><b>Logi\u2019Nord</b> g\xE8re un entrep\xF4t pr\xE8s de Lille.</p>
<p><b>Lundi 12 janvier</b> \u2014 Le fournisseur <b>SportTop</b> livre <b>120 cartons</b> de ballons (r\xE9f\xE9rence B310) au quai n\xB04. Chaque carton contient <b>10 ballons</b>. Yanis, r\xE9ceptionnaire, trouve <b>3 cartons ab\xEEm\xE9s</b> : il les met de c\xF4t\xE9, note le probl\xE8me sur le bon de livraison, puis signe.</p>
<p>L\xE9na, cariste, range les cartons en bon \xE9tat en zone D et note l\u2019emplacement sur la fiche de stock.</p>
<p><b>Mercredi 14 janvier</b> \u2014 Le client <b>Sport Plus</b> commande 50 ballons B310 et 20 gourdes G205. Ma\xEBlle fait le picking mais ne prend que <b>45 ballons</b>. Au contr\xF4le d\u2019exp\xE9dition, Rayan rep\xE8re l\u2019erreur ; Ma\xEBlle ajoute les 5 ballons. Rayan emballe et colle l\u2019\xE9tiquette.</p>
<p><b>Jeudi 15 janvier</b> \u2014 Le transporteur <b>NordExpress</b> r\xE9cup\xE8re le colis au quai n\xB01.</p>`,xt={id:"cap-m0",num:0,ready:!0,title:"R\xE9vision : les bases de la logistique",competences:["C1.1.3","C3.1.2"],duree:"1 h 30",intro:"On revoit ensemble tout ce que tu as appris depuis la rentr\xE9e avant de commencer les flux sortants.",objectifs:["Dire avec mes mots ce qu\u2019est la logistique","Citer dans l\u2019ordre les 4 fonctions d\u2019un entrep\xF4t","Faire la diff\xE9rence entre flux physique et flux d\u2019information","Reconna\xEEtre les documents : bon de commande, bon de livraison, fiche de stock, bordereau de pr\xE9paration, \xE9tiquette de transport","Savoir qui fait quoi dans un entrep\xF4t"],cours:[{titre:"La logistique, c\u2019est quoi ?",html:`<p>La <b>logistique</b>, c\u2019est <b>acheminer une marchandise du fournisseur jusqu\u2019au client</b>, avec les informations qui l\u2019accompagnent.</p>
      <div class="keybox">\u{1F3AF} Le bon produit, en bonne quantit\xE9, au bon endroit, au bon moment.</div>
      ${De}<p>La cha\xEEne logistique commence <b>chez le fournisseur</b> et se termine <b>chez le client</b>. L\u2019entrep\xF4t est au milieu.</p>`,check:{t:"qcm",q:"La cha\xEEne logistique commence :",o:["chez le fournisseur","\xE0 l\u2019entrep\xF4t","chez le client","sur le quai d\u2019exp\xE9dition"],a:0}},{titre:"Les 4 fonctions de l\u2019entrep\xF4t",html:`${Ae}
      <ul class="cards4">
        <li><b>1. R\xE9ception</b> La marchandise arrive : on d\xE9charge et on contr\xF4le.</li>
        <li><b>2. Stockage</b> On range la marchandise au bon emplacement.</li>
        <li><b>3. Pr\xE9paration de commande</b> On pr\xE9l\xE8ve les articles du client : c\u2019est le <b>picking</b>.</li>
        <li><b>4. Exp\xE9dition</b> On contr\xF4le, on emballe, on \xE9tiquette et on charge le camion.</li>
      </ul>
      <div class="keybox">\u{1F9E0} Astuce : la marchandise <b>arrive</b>, elle est <b>rang\xE9e</b>, on la <b>pr\xE9l\xE8ve</b>, puis elle <b>repart</b>.</div>`,check:{t:"order",q:"Remets les 4 fonctions dans l\u2019ordre.",items:["R\xE9ception","Stockage","Pr\xE9paration de commande","Exp\xE9dition"]}},{titre:"Deux flux : physique et information",html:`<div class="two">
        <div class="pill-box phys"><b>\u{1F4E6} Flux physique</b>Ce qui <b>se d\xE9place vraiment</b> : la marchandise, la palette, le camion, le chargement, le rangement, le picking, l\u2019emballage.</div>
        <div class="pill-box info"><b>\u{1F4C4} Flux d\u2019information</b>Les <b>documents et les donn\xE9es</b> : bon de commande, bon de livraison, fiche de stock, bordereau de pr\xE9paration, \xE9tiquette de transport.</div>
      </div>
      ${Re}<p>Le flux d\u2019information circule <b>tout au long</b> du parcours, du fournisseur jusqu\u2019au client.</p>`,check:{t:"sort",q:"Classe ces deux \xE9l\xE9ments.",cats:["Flux physique","Flux d\u2019information"],items:[["Le chargement du camion",0],["Le bon de commande",1]]}},{titre:"Les documents \xE0 conna\xEEtre",html:`<table class="tbl"><tr><th>Document</th><th>Qui le fait ?</th><th>\xC0 quoi il sert ?</th></tr>
        <tr><td><b>Bon de commande</b></td><td>Le client</td><td>Demander des articles</td></tr>
        <tr><td><b>Bon de livraison</b></td><td>Le fournisseur</td><td>Accompagne la marchandise livr\xE9e</td></tr>
        <tr><td><b>Fiche de stock</b></td><td>Le magasinier / cariste</td><td>Noter o\xF9 la marchandise est rang\xE9e</td></tr>
        <tr><td><b>Bordereau de pr\xE9paration</b></td><td>Le pr\xE9parateur de commande</td><td>Liste des articles pr\xE9lev\xE9s, joint au colis</td></tr>
        <tr><td><b>\xC9tiquette de transport</b></td><td>L\u2019agent d\u2019exp\xE9dition</td><td>Informations pour livrer le colis</td></tr></table>
      ${qt}<p>La <b>r\xE9f\xE9rence (SKU)</b> est le code qui identifie un article de fa\xE7on <b>unique</b>.</p>`,check:{t:"qcm",q:"Le document envoy\xE9 par le client pour demander des articles est :",o:["le bon de livraison","le bon de commande","la fiche de stock","l\u2019\xE9tiquette de transport"],a:1}},{titre:"Les m\xE9tiers de l\u2019entrep\xF4t",html:`<ul class="jobs">
        <li><span>\u{1F9FE}</span><b>R\xE9ceptionnaire</b> contr\xF4le les livraisons \xE0 leur arriv\xE9e.</li>
        <li><span>\u{1F69C}</span><b>Cariste</b> conduit le chariot \xE9l\xE9vateur pour d\xE9placer les palettes.</li>
        <li><span>\u{1F6D2}</span><b>Pr\xE9parateur de commande</b> pr\xE9l\xE8ve les articles (picking).</li>
        <li><span>\u{1F4E6}</span><b>Agent d\u2019exp\xE9dition</b> contr\xF4le, emballe, \xE9tiquette et charge.</li>
        <li><span>\u{1F69A}</span><b>Transporteur</b> achemine la marchandise jusqu\u2019au client.</li>
      </ul>
      ${Pe}<p>Le <b>quai</b> est la zone o\xF9 les camions chargent ou d\xE9chargent. La <b>palette</b> est le support qui permet de regrouper et d\xE9placer les marchandises.</p>${gt}`,check:{t:"qcm",q:"Le cariste :",o:["conduit le chariot \xE9l\xE9vateur pour d\xE9placer les palettes","passe les commandes au fournisseur","pr\xE9pare les factures","livre les colis chez le client"],a:0}},{titre:"Contr\xF4ler \xE0 chaque \xE9tape",html:`<p>Une erreur peut arriver \xE0 chaque \xE9tape. Il faut donc <b>contr\xF4ler</b> :</p>
      <ul><li>\xE0 la <b>r\xE9ception</b> : la r\xE9f\xE9rence et la quantit\xE9 par rapport au bon de livraison ;</li>
      <li>\xE0 l\u2019<b>exp\xE9dition</b> : le contenu du colis par rapport au bon de commande.</li></ul>
      <div class="keybox warn">\u26A0\uFE0F S\u2019il y a un \xE9cart (ex : 60 cartons livr\xE9s au lieu de 64), on <b>note l\u2019\xE9cart</b> sur le bon de livraison et on <b>pr\xE9vient son responsable</b>. On ne signe jamais sans rien dire.</div>
      ${bt}<p>Quand une erreur arrive, on cherche <b>son origine</b> pour qu\u2019elle <b>ne se reproduise pas</b>.</p>`,check:{t:"vf",q:"Un op\xE9rateur logistique n\u2019a jamais besoin de v\xE9rifier la conformit\xE9 d\u2019un colis.",a:!1,e:"Faux : le contr\xF4le \xE9vite que l\u2019erreur arrive chez le client."}}],activites:[{id:"a1",emoji:"\u{1F517}",kind:"Exercice",title:"La cha\xEEne logistique",consigne:"Remets la cha\xEEne dans l\u2019ordre puis compl\xE8te le sch\xE9ma.",items:[{t:"order",q:"Remets les \xE9tapes du trajet de la marchandise dans l\u2019ordre.",items:["Fournisseur","R\xE9ception","Stockage","Pr\xE9paration de commande","Exp\xE9dition","Client"]},{t:"fill",q:"Compl\xE8te avec les bons mots.",text:"La marchandise arrive : c\u2019est la {{r\xE9ception}}. Elle est rang\xE9e : c\u2019est le {{stockage}}. On pr\xE9l\xE8ve les articles : c\u2019est la {{pr\xE9paration de commande}}. Elle repart : c\u2019est l\u2019{{exp\xE9dition}}.",bank:["facturation","production"]},{t:"qcm",q:"Quand la marchandise arrive \xE0 l\u2019entrep\xF4t, la premi\xE8re fonction r\xE9alis\xE9e est :",o:["le stockage","la r\xE9ception","la pr\xE9paration de commande","l\u2019exp\xE9dition"],a:1},{t:"qcm",q:"Quelle est la derni\xE8re \xE9tape avant que la marchandise quitte l\u2019entrep\xF4t ?",o:["La r\xE9ception","Le stockage","La pr\xE9paration de commande","L\u2019exp\xE9dition"],a:3}]},{id:"a2",emoji:"\u{1F0CF}",kind:"Jeu",type:"memory",title:"Memory du vocabulaire",consigne:"Retourne deux cartes : retrouve chaque mot (orange) et sa d\xE9finition (bleu). Moins tu fais de coups, plus tu gagnes d\u2019\xE9toiles !",pairs:[["Palette","Support pour regrouper et d\xE9placer les marchandises"],["Quai","Zone o\xF9 les camions chargent ou d\xE9chargent"],["R\xE9f\xE9rence (SKU)","Code qui identifie un article de fa\xE7on unique"],["Picking","Pr\xE9lever les articles d\u2019une commande"],["Tra\xE7abilit\xE9","Suivre un produit tout au long de son parcours"],["Chariot \xE9l\ {t:"qcm",pts:5,q:"Pourquoi est-il important de rechercher l\u2019origine d\u2019une erreur de pr\xE9paration ?",o:["Ce n\u2019est pas utile si le client a \xE9t\xE9 livr\xE9","Pour \xE9viter qu\u2019elle se reproduise","Pour retarder la livraison","Pour trouver un coupable \xE0 sanctionner"],a:1},{t:"order",pts:5,q:"Logi\u2019Nord \u2014 Remets les \xE9v\xE9nements dans l\u2019ordre.",items:["SportTop livre les cartons au quai n\xB04","L\xE9na range les cartons en zone D","Sport Plus envoie un bon de commande","Ma\xEBlle fait le picking","Rayan rep\xE8re l\u2019erreur de quantit\xE9","NordExpress r\xE9cup\xE8re le colis"]}]}};var is=`<p><b>LOGIVAL</b> est une entreprise priv\xE9e de logistique install\xE9e \xE0 <b>Meaux</b>. Elle emploie <b>42 salari\xE9s</b> : pr\xE9parateurs de commandes, caristes, agents de quai, un chef d\u2019\xE9quipe et M. Benali, le responsable d\u2019entrep\xF4t.</p>
<p>LOGIVAL stocke et exp\xE9die les produits de ses clients : une enseigne de magasins de sport et un site de vente en ligne de petit \xE9lectrom\xE9nager. Les produits arrivent de <b>fournisseurs</b> fran\xE7ais et asiatiques.</p>
<p>Pour travailler, LOGIVAL utilise un b\xE2timent de 8 000 m\xB2, 12 chariots \xE9l\xE9vateurs, des racks et un logiciel de gestion d\u2019entrep\xF4t (WMS). Elle a emprunt\xE9 de l\u2019argent \xE0 sa <b>banque</b> pour acheter 3 nouveaux chariots.</p>
<p>Chaque mois, LOGIVAL verse les <b>salaires</b>, paie des <b>imp\xF4ts et des cotisations sociales</b>, et re\xE7oit le <b>paiement de ses clients</b>.</p>
<p>Le lundi, l\u2019\xE9quipe du matin (6 pr\xE9parateurs) a pr\xE9par\xE9 <b>1 440 lignes de commande en 8 heures</b>.</p>`,yt={id:"cap-ed1",num:"\xC9D1",ready:!0,title:"L\u2019entreprise logistique dans son environnement \xE9conomique",competences:["\xC9D1"],duree:"1 h 30",intro:"Qui sont les acteurs de l\u2019\xE9conomie, et quelle est la place d\u2019un entrep\xF4t comme LOGIVAL parmi eux ?",objectifs:["Citer les 4 agents \xE9conomiques et leur r\xF4le","Distinguer flux r\xE9els et flux mon\xE9taires","Classer une entreprise selon sa taille, son secteur et son activit\xE9","Pr\xE9senter les partenaires d\u2019une entreprise logistique","Expliquer les facteurs de production et calculer une productivit\xE9 simple"],cours:[{titre:"Les agents \xE9conomiques",html:`<p>Dans l\u2019\xE9conomie, on regroupe les acteurs en <b>agents \xE9conomiques</b> :</p>
      <ul class="cards4">
        <li><b>\u{1F3E0} Les m\xE9nages</b> Ils consomment et travaillent (toi, ta famille).</li>
        <li><b>\u{1F3ED} Les entreprises</b> Elles produisent des biens et des services pour les vendre.</li>
        <li><b>\u{1F3DB} L\u2019\xC9tat</b> Il pr\xE9l\xE8ve des imp\xF4ts et rend des services publics (\xE9cole, routes, sant\xE9).</li>
        <li><b>\u{1F3E6} Les banques</b> Elles gardent l\u2019\xE9pargne et pr\xEAtent de l\u2019argent (cr\xE9dits).</li>
      </ul>`,check:{t:"qcm",q:"LOGIVAL emprunte de l\u2019argent pour acheter des chariots. \xC0 quel agent s\u2019adresse-t-elle ?",o:["L\u2019\xC9tat","Une banque","Les m\xE9nages","Un client"],a:1}},{titre:"Le circuit \xE9conomique simplifi\xE9",html:`${$t}
      <div class="two"><div class="pill-box phys"><b>\u{1F4E6} Flux r\xE9els</b>Ce qui s\u2019\xE9change \xAB en nature \xBB : les biens, les services, le travail.</div>
      <div class="pill-box fin"><b>\u{1F4B6} Flux mon\xE9taires</b>L\u2019argent qui circule en \xE9change : salaires, paiements, imp\xF4ts, cr\xE9dits.</div></div>
      <div class="keybox">\u{1F9E0} \xC0 chaque flux r\xE9el correspond un flux mon\xE9taire en sens inverse : le salari\xE9 donne son <b>travail</b>, l\u2019entreprise lui verse un <b>salaire</b>.</div>`,check:{t:"sort",q:"Flux r\xE9el ou flux mon\xE9taire ?",cats:["Flux r\xE9el","Flux mon\xE9taire"],items:[["Le travail d\u2019un cariste",0],["Le salaire du cariste",1],["La livraison d\u2019une palette",0],["Le paiement de la facture",1]]}},{titre:"Toutes les entreprises ne se ressemblent pas",html:`<table class="tbl"><tr><th>Crit\xE8re</th><th>Cat\xE9gories</th></tr>
        <tr><td><b>Taille</b> (nombre de salari\xE9s)</td><td>Micro-entreprise : moins de 10 \xB7 PME : moins de 250 \xB7 ETI : moins de 5 000 \xB7 Grande entreprise : 5 000 et plus</td></tr>
        <tr><td><b>Secteur</b></td><td>Primaire : agriculture, p\xEAche, mines \xB7 Secondaire : industrie, construction \xB7 <b>Tertiaire : services (commerce, transport, logistique\u2026)</b></td></tr>
        <tr><td><b>Production</b></td><td>Biens (objets) ou services \xB7 Marchande (vendue sur un march\xE9) ou non marchande (gratuite ou presque, ex. : \xE9cole publique)</td></tr>
        <tr><td><b>Statut</b></td><td>Priv\xE9e (appartient \xE0 des personnes) \xB7 Publique (appartient \xE0 l\u2019\xC9tat) \xB7 Associative</td></tr></table>`,check:{t:"qcm",q:"LOGIVAL (42 salari\xE9s, logistique) est :",o:["une micro-entreprise du secteur primaire","une PME du secteur tertiaire","une grande entreprise du secteur secondaire","une ETI du secteur primaire"],a:1}},{titre:"L\u2019entreprise logistique et ses partenaires",html:`${Ae}<p>Une entreprise logistique travaille avec de nombreux partenaires :</p>
      <ul class="jobs"><li><span>\u{1F3ED}</span><b>Fournisseurs</b> : ils livrent les produits \xE0 l\u2019entrep\xF4t.</li>
      <li><span>\u{1F6D2}</span><b>Clients</b> : ils confient leurs produits et paient le service.</li>
      <li><span>\u{1F69A}</span><b>Transporteurs</b> : ils acheminent les marchandises.</li>
      <li><span>\u{1F477}</span><b>Salari\xE9s</b> : ils apportent leur travail.</li>
      <li><span>\u{1F3E6}</span><b>Banque</b> et <span>\u{1F3DB}</span><b>\xC9tat</b> : cr\xE9dits, imp\xF4ts, cotisations.</li></ul>`,check:{t:"match",q:"Associe chaque partenaire \xE0 ce qu\u2019il apporte \xE0 LOGIVAL.",pairs:[["Le fournisseur","Les produits livr\xE9s"],["Le client","Le paiement du service"],["Le salari\xE9","Son travail"],["La banque","Un cr\xE9dit"]]}},{titre:"Produire : travail, capital et productivit\xE9",html:`<p>Pour produire, une entreprise combine deux <b>facteurs de production</b> :</p>
      <div class="two"><div class="pill-box info"><b>\u{1F477} Le travail</b>Les salari\xE9s et leurs comp\xE9tences (qualification).</div>
      <div class="pill-box phys"><b>\u{1F3D7} Le capital</b>Les b\xE2timents, les chariots, les racks, les ordinateurs, le WMS.</div></div>
      <p>La <b>productivit\xE9</b> mesure l\u2019efficacit\xE9 : ce que l\u2019on produit pour une quantit\xE9 de travail.</p>
      <div class="keybox">Productivit\xE9 horaire = production \xF7 nombre d\u2019heures<br>Exemple : 400 colis pr\xE9par\xE9s en 8 h \u2192 400 \xF7 8 = <b>50 colis par heure</b>.</div>
      <p>Un nouveau mat\xE9riel (scanner, chariot plus rapide) ou une meilleure organisation <b>augmente la productivit\xE9</b>.</p>`,check:{t:"num",q:"Un pr\xE9parateur pr\xE9pare 360 lignes en 6 heures. Quelle est sa productivit\xE9 horaire ?",a:60,unit:"lignes / heure"}},{titre:"La logistique cr\xE9e de la richesse",html:`<p>Une entreprise <b>cr\xE9e de la richesse</b> quand ce qu\u2019elle vend vaut plus que ce qu\u2019elle a achet\xE9 pour produire. Cette diff\xE9rence s\u2019appelle la <b>valeur ajout\xE9e</b>.</p>
      <div class="keybox">Valeur ajout\xE9e = chiffre d\u2019affaires \u2212 consommations interm\xE9diaires (achats de carburant, emballages, \xE9lectricit\xE9\u2026)</div>
      <p>La valeur ajout\xE9e sert \xE0 payer les <b>salaires</b>, les <b>imp\xF4ts</b>, les <b>int\xE9r\xEAts</b> \xE0 la banque et le <b>b\xE9n\xE9fice</b> de l\u2019entreprise.</p>
      <p>La logistique cr\xE9e de la valeur : un produit disponible <b>au bon endroit et au bon moment</b> vaut plus pour le client.</p>`,check:{t:"vf",q:"La valeur ajout\xE9e sert notamment \xE0 payer les salaires.",a:!0}}],activites:[{id:"a1",emoji:"\u{1F0CF}",kind:"Jeu",type:"memory",title:"Memory de l\u2019\xE9conomie",consigne:"Retrouve chaque mot (orange) et sa d\xE9finition (bleu).",pairs:[["M\xE9nages","Consomment et apportent leur travail"],["Entreprise","Produit des biens ou des services"],["\xC9tat","Pr\xE9l\xE8ve des imp\xF4ts, rend des services publics"],["Banque","Collecte l\u2019\xE9pargne et accorde des cr\xE9dits"],["Capital","B\xE2timents, machines, chariots, logiciels"],["Productivit\xE9","Production obtenue par heure de travail"]]},{id:"a2",emoji:"\u{1F3F7}",kind:"Exercice",title:"Primaire, secondaire ou tertiaire ?",consigne:"Classe chaque entreprise dans son secteur d\u2019activit\xE9.",items:[{t:"sort",q:"Classe ces entreprises.",cats:["Primaire","Secondaire","Tertiaire"],items:[["Une exploitation agricole de bl\xE9",0],["Une usine de v\xE9los",1],["Un entrep\xF4t logistique",2],["Une entreprise de p\xEAche",0],["Un transporteur routier",2],["Une usine de yaourts",1]]},{t:"sort",q:"Et celles-ci.",cats:["Primaire","Secondaire","Tertiaire"],items:[["Une banque",2],["Une entreprise du b\xE2timent",1],["Un supermarch\xE9",2],["Une carri\xE8re de pierre",0],["Une usine de cartons",1],["Un site de vente en ligne",2]]},{t:"sort",q:"Quelle taille d\u2019entreprise ?",cats:["Micro","PME","ETI","Grande"],items:[["Une boulangerie de 4 salari\xE9s",0],["LOGIVAL, 42 salari\xE9s",1],["Un transporteur de 1 200 salari\xE9s",2],["Un groupe logistique de 40 000 salari\xE9s",3]]}]},{id:"a3",emoji:"\u{1F501}",kind:"Exercice",title:"Les flux du circuit \xE9conomique",consigne:"Retrouve le sens des \xE9changes entre les agents.",items:[{t:"sort",q:"Flux r\xE9el ou flux mon\xE9taire ?",cats:["Flux r\xE9el","Flux mon\xE9taire"],items:[["Le m\xE9nage ach\xE8te un t\xE ,"Circuler en s\xE9curit\xE9",["C2.2.1","C2.2.2","C2.2.3"],["R\xE8gles de circulation","Circuler \xE0 vide, en charge, sur un plan inclin\xE9","Conduite \xE9cologique"]),x("cap-b2-3",3,"Man\u0153uvrer : stabilit\xE9 et plaque de charge",["C2.3.1","C2.3.2"],["Lire une plaque de charge","Comprendre le centre de gravit\xE9","Gerber et stocker en hauteur"]),x("cap-b2-4",4,"Fin de poste et maintenance",["C2.4.1","C2.4.2","C2.4.3"],["Stationner l\u2019engin","Faire la maintenance de premier niveau","Rendre compte des anomalies"])]}]};var Lt={id:"gatl-r0",num:0,ready:!0,title:"R\xE9vision : logistique, supply chain et m\xE9tiers",competences:["D2","D4"],duree:"2 h",intro:"On consolide les bases vues en d\xE9but d\u2019ann\xE9e avant d\u2019aller plus loin en logistique et en transport.",objectifs:["D\xE9finir la logistique et la supply chain, et les distinguer","Citer les 7 \xAB bons \xBB de la logistique","Associer une activit\xE9 \xE0 sa fonction : approvisionnement, production, stockage, distribution, logistique retour","Distinguer logistique amont, interne et aval","Identifier les flux physique, d\u2019information et financier","Situer les m\xE9tiers : op\xE9rationnels, coordination, management"],cours:[{titre:"Logistique : d\xE9finition et objectif",html:`<p>La <b>logistique</b> regroupe l\u2019ensemble des activit\xE9s qui permettent d\u2019acheminer un produit, <b>dans les bonnes quantit\xE9s, au bon endroit, au bon moment et au meilleur co\xFBt</b>, du fournisseur jusqu\u2019au client final. Elle organise les flux de marchandises, d\u2019informations et parfois de services.</p>
      <div class="keybox">\u{1F3AF} <b>Les 7 \xAB bons \xBB</b> : le bon produit \xB7 au bon endroit \xB7 au bon moment \xB7 en bonne quantit\xE9 \xB7 en bon \xE9tat \xB7 au bon co\xFBt \xB7 pour le bon client.</div>`,check:{t:"qcm",q:"Lequel de ces \xE9l\xE9ments ne fait PAS partie des 7 \xAB bons \xBB ?",o:["Au bon moment","Au bon co\xFBt","Au meilleur prix de vente","En bon \xE9tat"],a:2,e:"On parle du bon co\xFBt (le co\xFBt logistique), pas du prix de vente."}},{titre:"Les grandes fonctions de la cha\xEEne logistique",html:`<ul class="cards4">
        <li><b>Approvisionnement</b> Acheter et faire venir les mati\xE8res premi\xE8res ou marchandises.</li>
        <li><b>Production</b> Fabriquer ou transformer un produit.</li>
        <li><b>Stockage</b> R\xE9ceptionner, ranger, conserver, pr\xE9parer les commandes.</li>
        <li><b>Distribution / Transport</b> Acheminer jusqu\u2019au client (magasin ou particulier).</li>
        <li><b>Logistique retour</b> G\xE9rer les retours : d\xE9fauts, erreurs, \xE9changes, recyclage.</li>
      </ul>`,check:{t:"qcm",q:"Traiter le retour d\u2019un produit d\xE9fectueux rel\xE8ve de :",o:["l\u2019approvisionnement","la distribution","la logistique retour","la production"],a:2}},{titre:"Amont, interne, aval",html:'<div class="flow"><span class="node">Logistique amont<small>transport et approvisionnement depuis les fournisseurs</small></span><span class="arrow">\u2192</span><span class="node">Logistique interne<small>stockage, gestion des stocks, pr\xE9paration de commandes</small></span><span class="arrow">\u2192</span><span class="node">Logistique aval<small>transport et distribution vers les clients</small></span></div>',check:{t:"sort",q:"Classe ces activit\xE9s.",cats:["Amont","Interne","Aval"],items:[["Livraison d\u2019un magasin",2],["Pr\xE9paration de commandes",1],["Approvisionnement chez un fournisseur",0]]}},{titre:"Les trois flux",html:`${Re}<div class="three">
        <div class="pill-box phys"><b>\u{1F4E6} Physique</b>D\xE9placement r\xE9el de la marchandise (un camion qui livre des cartons).</div>
        <div class="pill-box info"><b>\u{1F4C4} Information</b>Donn\xE9es li\xE9es \xE0 la commande ou au suivi (confirmation, num\xE9ro de suivi, bon de livraison).</div>
        <div class="pill-box fin"><b>\u{1F4B6} Financier</b>Mouvement d\u2019argent li\xE9 \xE0 la transaction (paiement d\u2019une facture).</div>
      </div>`,check:{t:"qcm",q:"Le client re\xE7oit un SMS de suivi de sa livraison. C\u2019est un flux :",o:["physique","d\u2019information","financier"],a:1}},{titre:"Logistique et supply chain",html:`<p>La <b>supply chain</b> (cha\xEEne d\u2019approvisionnement globale) est une vision <b>plus large</b> que la logistique : elle relie <b>tous les acteurs</b>, de la mati\xE8re premi\xE8re au client final.</p>
      <div class="flow"><span class="node">Fournisseurs de mati\xE8res</span><span class="arrow">\u2192</span><span class="node">Usines</span><span class="arrow">\u2192</span><span class="node">Entrep\xF4ts</span><span class="arrow">\u2192</span><span class="node">Transporteurs</span><span class="arrow">\u2192</span><span class="node">Distributeurs</span><span class="arrow">\u2192</span><span class="node end">Client final</span></div>
      ${De}<p><b>Exemple \u2014 une paire de baskets :</b> caoutchouc et textile \u2192 usine en Asie \u2192 bateau jusqu\u2019en Europe \u2192 entrep\xF4t \u2192 pr\xE9paration pour les magasins \u2192 camion \u2192 vente.</p>
      <p><b>Enjeux actuels :</b> e-commerce, livraison rapide et fiable (24 h), r\xE9duction des co\xFBts, RSE (moins de CO\u2082, transport optimis\xE9, emballages recyclables).</p>`,check:{t:"vf",q:"La supply chain est une notion plus restreinte que la logistique.",a:!1,e:"C\u2019est l\u2019inverse : la supply chain englobe tous les acteurs."}},{titre:"Les m\xE9tiers de la logistique",html:`<table class="tbl"><tr><th>Niveau</th><th>Exemples</th></tr>
        <tr><td><b>Op\xE9rationnel</b></td><td>Cariste, pr\xE9parateur de commandes, agent de quai</td></tr>
